name: CI

# Run CI when a PR is opened against the branch `main`
# and when one pushes a commit to `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Run CI on all 3 latest OSes
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node toolchain
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Setup PureScript tooling
        run:
          npm i -g purescript@0.15.16 purs-tidy@0.11.1 spago@1.0.4

      - name: Cache PureScript dependencies
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.yaml', 'spago.lock') }}
          path: |
            .spago
            output

      - name: Build the project
        run: |
          npx spago build -p node-http2 --pedantic-packages

      - name: Run tests
        run: |
          chmod +x test/regen-pem-files.sh
          sh test/regen-pem-files.sh

          npx spago test -p node-http2 --pedantic-packages

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: |
          purs-tidy check src test
